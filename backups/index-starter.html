<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Board</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f2f2f2; color: #222; }
    header { padding: 16px 24px; background: #ffffff; border-bottom: 1px solid #ddd; }
    h1 { margin: 0; font-size: 22px; }
    .board { display: flex; gap: 16px; padding: 24px; }
    .column { flex: 1; background: #e4e4e4; border-radius: 6px; padding: 12px; min-height: 300px; }
    .column h2 { margin: 0 0 12px; font-size: 16px; }
    .empty { color: #777; font-size: 14px; }
  </style>
</head>
<body>
  <!-- Week 10 starter: a board that looks like a board and does nothing yet. -->
  <header>
    <h1>My Board</h1>
  </header>

  <main class="board">
    <section class="column">
      <h2>To Do</h2>
      <p class="empty">No cards yet</p>
    </section>

    <section class="column">
      <h2>Doing</h2>
      <p class="empty">No cards yet</p>
    </section>

    <section class="column">
      <h2>Done</h2>
      <p class="empty">No cards yet</p>
    </section>
  </main>
</body>
</html>
