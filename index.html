<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Board</title>
<style>
  :root {
    --paper: #F7F6F3;
    --lane: #EFEFEA;
    --card: #FFFFFF;
    --line: #E2E2DC;
    --ink: #191E1C;
    --muted: #646B67;
    --accent: #2E5A88;
    --won: #2D6A4F;
    --danger: #B43B34;
    --danger-bg: #FDF1F0;
    --danger-border: #F3CBC8;
    --font: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
  }

  /* Header */
  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 28px 36px 8px;
  }
  .top h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .top .tagline {
    font-size: 13.5px;
    color: var(--muted);
    font-weight: 500;
  }
  .sub {
    padding: 0 36px 24px;
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  /* Board Grid */
  .board {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    padding: 0 36px 44px;
    align-items: start;
  }
  .lane {
    background: var(--lane);
    border-radius: 10px;
    padding: 14px 12px 14px;
    border: 1px solid rgba(0,0,0,0.03);
    min-height: 220px;
    transition: background 0.15s ease, outline 0.15s ease;
  }
  .lane.drag-over {
    background: #E5E9E3;
    outline: 2px dashed var(--accent);
    outline-offset: -2px;
  }
  .lane-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 6px 12px;
  }
  .lane-head h2 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .lane-head .badge {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }
  .lane[data-col-id="won"] .lane-head .badge {
    background: var(--won);
  }
  .count {
    min-width: 24px;
    padding: 1px 9px;
    border-radius: 999px;
    background: #DFE2DC;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 48px;
  }

  /* Lead Card */
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    cursor: grab;
    user-select: none;
    touch-action: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .card:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(0,0,0,0.05);
  }
  .card.dragging {
    opacity: 0.45;
    cursor: grabbing;
    transform: scale(0.98);
  }
  .card-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .card h3 {
    margin: 0 0 5px;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink);
    word-break: break-word;
    flex: 1;
  }
  .card .phone {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    word-break: break-word;
  }
  .card .phone svg {
    width: 13px;
    height: 13px;
    fill: currentColor;
    opacity: 0.7;
    flex-shrink: 0;
  }
  .card .has-note {
    font-size: 11px;
    color: var(--accent);
    background: #EAF0F6;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 500;
    white-space: nowrap;
  }

  /* Quick Move controls on card */
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid #F0F2EF;
  }
  .move-btns {
    display: flex;
    gap: 4px;
  }
  .btn-move {
    background: transparent;
    border: 1px solid #E0E4DE;
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }
  .btn-move:hover {
    background: #EAEFE7;
    color: var(--ink);
    border-color: var(--muted);
  }

  .add {
    margin-top: 10px;
    width: 100%;
    padding: 9px 12px;
    border: 1px dashed #D0D4CE;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13.5px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .add:hover, .add:focus-visible {
    background: #E3E7E1;
    color: var(--ink);
    border-color: var(--muted);
  }
  .add::before { content: "+ "; font-weight: 600; }

  /* Modal Backdrop */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(25,30,28,0.42);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }

  .dialog {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border-radius: 10px;
    padding: 24px 22px 20px;
    box-shadow: 0 18px 42px rgba(0,0,0,0.20);
    border: 1px solid rgba(0,0,0,0.05);
  }
  .dialog h3 {
    margin: 0 0 16px;
    font-size: 17.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 5px;
  }
  .optional {
    font-weight: 400;
    color: var(--muted);
    font-size: 11.5px;
    margin-left: 4px;
  }
  .field { margin-bottom: 14px; }
  input[type=text], input[type=tel], select, textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: #fff;
    transition: border-color 0.15s ease;
  }
  textarea {
    min-height: 64px;
    resize: vertical;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .field.error input {
    border-color: var(--danger);
    background: #FFFDFD;
  }
  .error-msg {
    margin: 6px 0 0;
    font-size: 12.5px;
    color: var(--danger);
    display: none;
    font-weight: 500;
  }
  .field.error .error-msg { display: block; }

  /* Delete Confirmation Box */
  .confirm-box {
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    border-radius: 6px;
    font-size: 13px;
    color: var(--danger);
    display: none;
  }
  .confirm-box.visible { display: block; }
  .confirm-box p {
    margin: 0 0 10px;
    font-weight: 600;
  }
  .confirm-actions {
    display: flex;
    gap: 8px;
  }

  /* Actions */
  .actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
  }
  .actions .spacer { flex: 1; }
  .btn {
    padding: 8px 15px;
    border-radius: 6px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    transition: background 0.12s ease;
  }
  .btn:hover { background: #F4F4F2; }
  .btn.primary {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }
  .btn.primary:hover { background: #2E3431; }
  .btn.danger {
    border-color: transparent;
    color: var(--danger);
    padding-left: 2px;
  }
  .btn.danger:hover { background: transparent; text-decoration: underline; }
  .btn.danger-confirm {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
    padding: 6px 12px;
    font-size: 12.5px;
  }
  .btn.danger-confirm:hover { background: #9B2C26; }
  .btn.cancel-sm {
    padding: 6px 12px;
    font-size: 12.5px;
  }

  @media (max-width: 820px) {
    .board { grid-template-columns: 1fr; }
    .top, .sub, .board { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>

<header class="top">
  <h1 id="app-title">Lead Board</h1>
  <span class="tagline">Apex Studio · Simple CRM</span>
</header>
<p class="sub">Drag a lead to the next column as the deal moves forward.</p>

<main class="board" id="board" aria-label="Lead management lanes">
  <!-- Lanes rendered by JS -->
</main>

<!-- Add / Edit Modal -->
<div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="dialog">
    <h3 id="modal-title">Add Lead</h3>
    <form id="lead-form" onsubmit="event.preventDefault(); saveLead();">
      <div class="field" id="name-field">
        <label for="lead-name">Lead Name</label>
        <input id="lead-name" type="text" placeholder="e.g. Acme Corporation" autocomplete="off" />
        <p class="error-msg" id="name-error">Please enter a lead name to save.</p>
      </div>

      <div class="field" id="phone-field">
        <label for="lead-phone">Indian Mobile Number <span class="optional">(optional)</span></label>
        <input id="lead-phone" type="tel" placeholder="+91 98765 43210" autocomplete="off" />
        <p class="error-msg" id="phone-error">Please enter a valid 10-digit Indian mobile number (e.g. +91 98765 43210).</p>
      </div>

      <div class="field" id="stage-field">
        <label for="lead-stage">Column Stage</label>
        <select id="lead-stage">
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="won">Won</option>
        </select>
      </div>

      <div class="field" id="note-field">
        <label for="lead-note">Short Note <span class="optional">(optional)</span></label>
        <textarea id="lead-note" placeholder="Key details, budget, follow-up times..."></textarea>
      </div>

      <!-- Delete Confirmation Box -->
      <div class="confirm-box" id="confirm-box">
        <p id="confirm-msg">Are you sure you want to delete this lead?</p>
        <div class="confirm-actions">
          <button class="btn danger-confirm" id="confirm-delete-btn" type="button">Yes, delete</button>
          <button class="btn cancel-sm" id="cancel-delete-btn" type="button">Cancel</button>
        </div>
      </div>

      <div class="actions" id="modal-actions">
        <button class="btn danger" id="delete-btn" type="button" style="display: none;">Delete</button>
        <span class="spacer"></span>
        <button class="btn" id="cancel-btn" type="button">Cancel</button>
        <button class="btn primary" id="save-btn" type="submit">Save lead</button>
      </div>
    </form>
  </div>
</div>

<script>
  // Ponytail: clean, minimal, native JavaScript. No external libraries.
  const COLUMNS = [
    { id: 'new', name: 'New' },
    { id: 'contacted', name: 'Contacted' },
    { id: 'won', name: 'Won' }
  ];

  const STORAGE_KEY = 'lead_board_data';

  // Load leads from localStorage, surviving refresh
  function loadLeads() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {
      console.error('Failed to parse localStorage:', e);
    }
    return [
      { id: 'lead-1', name: 'Aarav Sharma', phone: '+91 98765 43210', note: 'Interested in commercial plan', columnId: 'new' },
      { id: 'lead-2', name: 'Priya Patel', phone: '+91 91234 56789', note: 'Demo call scheduled', columnId: 'contacted' },
      { id: 'lead-3', name: 'Harbor Logistics Mumbai', phone: '+91 98200 11223', note: 'Annual contract closed', columnId: 'won' }
    ];
  }

  let leads = loadLeads();
  let activeLeadId = null;
  let activeColId = 'new';

  function saveStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(leads));
  }

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function moveLeadToCol(leadId, targetColId) {
    const lead = leads.find(l => l.id === leadId);
    if (lead && lead.columnId !== targetColId) {
      lead.columnId = targetColId;
      saveStorage();
      render();
    }
  }

  function render() {
    const board = document.getElementById('board');
    board.innerHTML = '';

    COLUMNS.forEach((col, colIdx) => {
      const colLeads = leads.filter(l => l.columnId === col.id);
      const lane = document.createElement('section');
      lane.className = 'lane';
      lane.dataset.colId = col.id;
      lane.id = `lane-${col.id}`;

      lane.innerHTML = `
        <div class="lane-head">
          <h2><span class="badge"></span>${escapeHtml(col.name)}</h2>
          <span class="count" id="count-${col.id}">${colLeads.length}</span>
        </div>
        <div class="cards" data-col-id="${col.id}" id="cards-${col.id}"></div>
        <button class="add" type="button" id="add-btn-${col.id}">Add lead</button>
      `;

      const cardsContainer = lane.querySelector('.cards');

      colLeads.forEach(lead => {
        const card = document.createElement('article');
        card.className = 'card';
        card.draggable = true;
        card.dataset.id = lead.id;
        card.id = `card-${lead.id}`;

        let inner = `<div class="card-header"><h3>${escapeHtml(lead.name)}</h3>`;
        if (lead.note && lead.note.trim()) {
          inner += `<span class="has-note" title="Has note">Note</span>`;
        }
        inner += `</div>`;

        if (lead.phone && lead.phone.trim()) {
          inner += `
            <p class="phone">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24 11.72 11.72 0 003.68.59 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.72 11.72 0 00.59 3.68 1 1 0 01-.24 1.02l-2.23 2.09z"/></svg>
              <span>${escapeHtml(lead.phone)}</span>
            </p>
          `;
        }

        // Quick move buttons for ease of moving deals
        let moveButtons = '';
        if (colIdx > 0) {
          const prevCol = COLUMNS[colIdx - 1];
          moveButtons += `<button class="btn-move" type="button" data-target="${prevCol.id}" title="Move to ${prevCol.name}">← ${prevCol.name}</button>`;
        }
        if (colIdx < COLUMNS.length - 1) {
          const nextCol = COLUMNS[colIdx + 1];
          moveButtons += `<button class="btn-move" type="button" data-target="${nextCol.id}" title="Move to ${nextCol.name}">${nextCol.name} →</button>`;
        }

        inner += `
          <div class="card-footer">
            <span style="font-size:11.5px; color:var(--muted); font-weight:500;">Deal stage: ${escapeHtml(col.name)}</span>
            <div class="move-btns">${moveButtons}</div>
          </div>
        `;

        card.innerHTML = inner;

        // Native HTML5 Drag start & end
        card.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', lead.id);
          card.classList.add('dragging');
        });
        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
        });

        // Quick move button clicks
        card.querySelectorAll('.btn-move').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            moveLeadToCol(lead.id, btn.dataset.target);
          });
        });

        // Click to edit
        card.addEventListener('click', () => openEditModal(lead));

        cardsContainer.appendChild(card);
      });

      // Add button click
      lane.querySelector('.add').addEventListener('click', () => openAddModal(col.id));

      // Drag and drop events on lane
      lane.addEventListener('dragover', (e) => {
        e.preventDefault();
        lane.classList.add('drag-over');
      });
      lane.addEventListener('dragleave', (e) => {
        if (!lane.contains(e.relatedTarget)) {
          lane.classList.remove('drag-over');
        }
      });
      lane.addEventListener('drop', (e) => {
        e.preventDefault();
        lane.classList.remove('drag-over');
        const leadId = e.dataTransfer.getData('text/plain');
        if (leadId) {
          moveLeadToCol(leadId, col.id);
        }
      });

      board.appendChild(lane);
    });
  }

  // Modal logic
  const modal = document.getElementById('modal');
  const nameField = document.getElementById('name-field');
  const nameInput = document.getElementById('lead-name');
  const phoneInput = document.getElementById('lead-phone');
  const stageSelect = document.getElementById('lead-stage');
  const noteInput = document.getElementById('lead-note');
  const deleteBtn = document.getElementById('delete-btn');
  const confirmBox = document.getElementById('confirm-box');
  const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
  const phoneField = document.getElementById('phone-field');
  const cancelDeleteBtn = document.getElementById('cancel-delete-btn');

  function validateAndFormatIndianMobile(raw) {
    if (!raw) return { valid: true, formatted: '' };
    const cleaned = raw.replace(/[\s\-\(\)\.]/g, '');
    const match = cleaned.match(/^(?:\+91|91|0)?([6-9]\d{9})$/);
    if (!match) return { valid: false, formatted: raw };
    const num = match[1];
    return { valid: true, formatted: `+91 ${num.slice(0, 5)} ${num.slice(5)}` };
  }

  function openAddModal(colId) {
    activeLeadId = null;
    activeColId = colId || 'new';
    document.getElementById('modal-title').textContent = 'Add Lead';
    nameInput.value = '';
    phoneInput.value = '';
    stageSelect.value = activeColId;
    noteInput.value = '';
    nameField.classList.remove('error');
    phoneField.classList.remove('error');
    deleteBtn.style.display = 'none';
    confirmBox.classList.remove('visible');
    modal.classList.add('open');
    nameInput.focus();
  }

  function openEditModal(lead) {
    activeLeadId = lead.id;
    activeColId = lead.columnId;
    document.getElementById('modal-title').textContent = 'Edit Lead';
    nameInput.value = lead.name || '';
    phoneInput.value = lead.phone || '';
    stageSelect.value = lead.columnId || 'new';
    noteInput.value = lead.note || '';
    nameField.classList.remove('error');
    phoneField.classList.remove('error');
    deleteBtn.style.display = 'inline-block';
    confirmBox.classList.remove('visible');
    modal.classList.add('open');
    nameInput.focus();
  }

  function closeModal() {
    modal.classList.remove('open');
    confirmBox.classList.remove('visible');
    nameField.classList.remove('error');
    phoneField.classList.remove('error');
    activeLeadId = null;
  }

  document.getElementById('cancel-btn').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
  });

  // Delete flow: asks "Are you sure?" first
  deleteBtn.addEventListener('click', () => {
    confirmBox.classList.add('visible');
    confirmDeleteBtn.focus();
  });

  cancelDeleteBtn.addEventListener('click', () => {
    confirmBox.classList.remove('visible');
    deleteBtn.focus();
  });

  confirmDeleteBtn.addEventListener('click', () => {
    if (activeLeadId) {
      leads = leads.filter(l => l.id !== activeLeadId);
      saveStorage();
      render();
      closeModal();
    }
  });

  // Save logic with empty name validation and Indian mobile validation
  function saveLead() {
    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim();
    const stage = stageSelect.value || activeColId || 'new';
    const note = noteInput.value.trim();

    if (!name) {
      nameField.classList.add('error');
      nameInput.focus();
      return;
    }

    const phoneCheck = validateAndFormatIndianMobile(phone);
    if (!phoneCheck.valid) {
      phoneField.classList.add('error');
      phoneInput.focus();
      return;
    }

    const formattedPhone = phoneCheck.formatted;

    if (activeLeadId) {
      const target = leads.find(l => l.id === activeLeadId);
      if (target) {
        target.name = name;
        target.phone = formattedPhone;
        target.columnId = stage;
        target.note = note;
      }
    } else {
      leads.push({
        id: 'lead-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
        name: name,
        phone: formattedPhone,
        note: note,
        columnId: stage
      });
    }

    saveStorage();
    render();
    closeModal();
  }

  // Clear errors when typing
  nameInput.addEventListener('input', () => {
    if (nameInput.value.trim()) {
      nameField.classList.remove('error');
    }
  });

  phoneInput.addEventListener('input', () => {
    phoneField.classList.remove('error');
  });

  // Initial render
  render();
</script>
</body>
</html>
